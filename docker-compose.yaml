x-common-env-variables: &common-env-variables
  APP_NAME: '${APP_NAME}'
  APP_ENV: '${APP_ENV}'
  APP_KEY: '${APP_KEY}'
  APP_DEBUG: '${APP_DEBUG}'
  APP_URL: '${APP_URL}'

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: '${DB_DATABASE}'
  DB_USERNAME: '${DB_USERNAME}'
  DB_PASSWORD: '${DB_PASSWORD}'

  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis

  REDIS_HOST: redis
  REDIS_PORT: 6379

  ZK_SERVICE_URL: 'http://zkservice:8001'
  ZK_SERVICE_API_KEY: '${ZK_SERVICE_API_KEY}'

services:
  # ---------------------------------------------------
  # Backend Laravel (App Server + Static Files)
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gobebio-backend
    container_name: gobebio-backend
    restart: unless-stopped
    ports:
      - "8081:80" # Coolify ocupa el 8000, cambiamos a 8081 para evitar conflicto.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    volumes:
      - gobebio-storage:/var/www/html/storage
    environment: *common-env-variables
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------
  # Laravel Worker (Queue Processing)
  # ---------------------------------------------------
  worker:
    image: gobebio-backend
    container_name: gobebio-worker
    restart: unless-stopped
    volumes:
      - gobebio-storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    environment: *common-env-variables
    command: php artisan queue:work --sleep=3 --tries=3

  # ---------------------------------------------------
  # Laravel Scheduler (Cron Jobs)
  # ---------------------------------------------------
  scheduler:
    image: gobebio-backend
    container_name: gobebio-scheduler
    restart: unless-stopped
    volumes:
      - gobebio-storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    environment: *common-env-variables
    command: php artisan schedule:work

  # ---------------------------------------------------
  # Microservice Biometric (FastAPI)
  # ---------------------------------------------------
  zkservice:
    build:
      context: ./zkService
      dockerfile: Dockerfile
    image: gobebio-zkservice
    container_name: gobebio-zkservice
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gobebio-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/docs" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------
  # Database (MySQL)
  # ---------------------------------------------------
  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: gobebio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - gobebio-mysql-data:/var/lib/mysql
    networks:
      - gobebio-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------
  # Redis (Cache & Queue)
  # ---------------------------------------------------
  redis:
    image: 'redis:alpine'
    container_name: gobebio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - gobebio-redis-data:/data
    networks:
      - gobebio-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------------------------------------------------
# Networks & Volumes
# ---------------------------------------------------
networks:
  gobebio-net:
    driver: bridge

volumes:
  gobebio-mysql-data:
    driver: local
  gobebio-redis-data:
    driver: local
  gobebio-storage:
    driver: local
