version: "3.8"

x-common-env-variables: &common-env-variables
  APP_NAME: '${APP_NAME}'
  APP_ENV: '${APP_ENV}'
  APP_KEY: '${APP_KEY}'
  APP_DEBUG: '${APP_DEBUG}'
  APP_URL: '${APP_URL}'

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: '${DB_DATABASE}'
  DB_USERNAME: '${DB_USERNAME}'
  DB_PASSWORD: '${DB_PASSWORD}'

  CACHE_DRIVER: file
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  
  ZK_SERVICE_URL: 'http://zkservice:8001' 
  ZK_SERVICE_API_KEY: '${ZK_SERVICE_API_KEY}'

services:
  # ---------------------------------------------------
  # Servidor Web Nginx (Punto de Entrada)
  # ---------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gobebio-nginx
    restart: unless-stopped
    ports: # Coolify gestionará los puertos, pero lo dejamos para pruebas locales.
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gobebio-net

  # ---------------------------------------------------
  # Backend Laravel (Aplicación Principal)
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gobebio-app
    container_name: gobebio-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      zkservice:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    volumes:
      - ./backend/storage:/var/www/html/storage
    environment: *common-env-variables

  # ---------------------------------------------------
  # Worker de Laravel (Procesa Colas)
  # ---------------------------------------------------
  worker:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    image: gobebio-app
    container_name: gobebio-worker
    restart: unless-stopped
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      backend:
        condition: service_started
      mysql:
        condition: service_healthy
      zkservice:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    environment: *common-env-variables
    command: php artisan queue:work --sleep=3 --tries=3

  # ---------------------------------------------------
  # Microservicio Biométrico (FastAPI)
  # ---------------------------------------------------
  zkservice:
    build:
      context: ./zkService
      dockerfile: Dockerfile
    container_name: gobebio-zkservice
    restart: unless-stopped
    # network_mode: "host"
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gobebio-net    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Base de Datos MySQL
  # ---------------------------------------------------
  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: gobebio-mysql
    restart: unless-stopped
    ports: # Exponemos el puerto para poder conectarnos desde el exterior si es necesario.
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - gobebio-mysql-data:/var/lib/mysql
    networks:
      - gobebio-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Redis (Caché y Colas)
  # ---------------------------------------------------
  redis:
    image: 'redis:alpine'
    container_name: gobebio-redis
    restart: unless-stopped
    ports: # Exponemos el puerto para pruebas.
      - "6379:6379"
    volumes:
      - gobebio-redis-data:/data
    networks:
      - gobebio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------------------------------------------------
# Red y Volúmenes
# ---------------------------------------------------
networks:
  gobebio-net:
    driver: bridge

volumes:
  gobebio-mysql-data:
    driver: local
  gobebio-redis-data:
    driver: local