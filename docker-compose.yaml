version: "3.8"

x-common-env-variables: &common-env-variables
  # Define un bloque de variables de entorno comunes para reutilizar.
  # Esto evita la duplicación y facilita el mantenimiento.
  APP_NAME: '${APP_NAME}'
  APP_ENV: '${APP_ENV}'
  APP_KEY: '${APP_KEY}'
  APP_DEBUG: '${APP_DEBUG}'
  APP_URL: '${APP_URL}'
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: '${DB_DATABASE}'
  DB_USERNAME: '${DB_USERNAME}'
  DB_PASSWORD: '${DB_PASSWORD}'
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # En producción, los contenedores se comunican a través de la red del host
  # porque zkservice usa network_mode: "host". Coolify expone el host
  # a través de una IP interna, pero para este caso, asumimos que el host es accesible.
  ZK_SERVICE_URL: 'http://localhost:8001'
  ZK_SERVICE_API_KEY: '${ZK_SERVICE_API_KEY}'

services:
  # ---------------------------------------------------
  # Servidor Web Nginx (Punto de Entrada)
  # ---------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gobebio-nginx
    restart: unless-stopped
    ports:
      - "8080:80" # Expone la aplicación en el puerto 8080 del host
    depends_on: # Nginx depende de que el backend esté listo para recibir tráfico.
      backend:
        condition: service_started
    # Permite que nginx resuelva 'host.docker.internal' a la IP del host,
    # para poder comunicarse con servicios en network_mode: "host" como zkservice.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gobebio-net

  # ---------------------------------------------------
  # Backend Laravel (Aplicación Principal)
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gobebio-app # Define el nombre de la imagen a construir y usar
    container_name: gobebio-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      zkservice: # Asegura que el backend espere a que el microservicio esté listo.
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    volumes:
      # En producción, el código está en la imagen. Solo el storage es persistente.
      - ./backend/storage:/var/www/html/storage
    environment: *common-env-variables

  # ---------------------------------------------------
  # Worker de Laravel (Procesa Colas)
  # ---------------------------------------------------
  worker:
    # Al definir la misma sección 'build' y 'image' que el backend,
    # Docker Compose construye la imagen una sola vez y la reutiliza.
    build: ./backend
    image: gobebio-app
    container_name: gobebio-worker
    restart: unless-stopped
    volumes:
      # En producción, el código está en la imagen. Solo el storage es persistente.
      - ./backend/storage:/var/www/html/storage
    depends_on: # El worker depende de que la BD y Redis estén listos.
      backend: # Añade esta dependencia para asegurar que la imagen se construya primero.
        condition: service_started
      mysql:
        condition: service_healthy
      zkservice: # Asegura que el worker espere a que el microservicio esté listo.
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    environment: *common-env-variables
    command: php artisan queue:work --sleep=3 --tries=3

  # ---------------------------------------------------
  # Microservicio Biométrico (FastAPI)
  # ---------------------------------------------------
  # En producción sobre Linux, el servicio se ejecuta en un contenedor
  # pero comparte la red del host para acceder a la LAN.
  # ---------------------------------------------------
  zkservice:
    build:
      context: ./zkService
      dockerfile: Dockerfile
    container_name: gobebio-zkservice
    restart: unless-stopped
    # network_mode: "host" en Linux da acceso a la red del servidor.
    # Esto es crucial para que el microservicio pueda ver los dispositivos en la LAN.
    network_mode: "host" 
    # El comando de producción no usa --reload.
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Base de Datos MySQL
  # ---------------------------------------------------
  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: gobebio-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - gobebio-mysql-data:/var/lib/mysql
    networks:
      - gobebio-net
    healthcheck:
      # Comprueba si el servidor MySQL está listo para aceptar comandos.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Redis (Caché y Colas)
  # ---------------------------------------------------
  redis:
    image: 'redis:alpine'
    container_name: gobebio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gobebio-redis-data:/data
    networks:
      - gobebio-net
    healthcheck:
      # Comprueba si el servidor Redis está respondiendo.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gobebio-net:
    driver: bridge

volumes:
  gobebio-mysql-data:
    driver: local
  gobebio-redis-data:
    driver: local