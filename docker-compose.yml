
services:
  # ---------------------------------------------------
  # Servidor Web Nginx (Punto de Entrada)
  # ---------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gobebio-nginx
    ports:
      - "8080:80" # Expone la aplicación en el puerto 8080 del host
    depends_on:
      - backend
    networks:
      - gobebio-net

  # ---------------------------------------------------
  # Backend Laravel (Aplicación Principal)
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gobebio-app # Le damos un nombre a la imagen construida
    container_name: gobebio-backend
    depends_on:
      - mysql
      - redis
    networks:
      - gobebio-net
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # El entrypoint original de la imagen se encargará de la configuración.
    # Solo especificamos el comando final que debe ejecutar.
    command: unitd --no-daemon --control unix:/var/run/control.unit.sock

  # ---------------------------------------------------
  # Worker de Laravel (Procesa Colas)
  # ---------------------------------------------------
  worker:
    # Reutilizamos la imagen construida para el backend en lugar de reconstruirla.
    # No necesita una sección 'build'.
    image: gobebio-app
    container_name: gobebio-worker
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend # CRÍTICO: El worker debe esperar a que la imagen del backend esté construida.
      - mysql
      - redis
    networks:
      - gobebio-net
    # CRÍTICO: El worker necesita las mismas variables de entorno que el backend
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: php artisan queue:work --sleep=3 --tries=3

  # ---------------------------------------------------
  # Microservicio Biométrico (FastAPI)
  # ---------------------------------------------------
  zkservice:
    build:
      context: ./zkService
      dockerfile: Dockerfile
    container_name: gobebio-zkservice
    networks:
      - gobebio-net
    volumes:
      - ./zkService:/app # Ideal para desarrollo, en producción el código va en la imagen
    # Se quita --reload para producción
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      - mysql

  # ---------------------------------------------------
  # Base de Datos MySQL
  # ---------------------------------------------------
  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: gobebio-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - gobebio-mysql-data:/var/lib/mysql
    networks:
      - gobebio-net

  # ---------------------------------------------------
  # Redis (Caché y Colas)
  # ---------------------------------------------------
  redis:
    image: 'redis:alpine'
    container_name: gobebio-redis
    ports:
      - "6379:6379"
    volumes:
      - gobebio-redis-data:/data
    networks:
      - gobebio-net

networks:
  gobebio-net:
    driver: bridge

volumes:
  gobebio-mysql-data:
    driver: local
  gobebio-redis-data:
    driver: local