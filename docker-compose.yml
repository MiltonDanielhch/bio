x-common-env-variables: &common-env-variables
  # Define un bloque de variables de entorno comunes para reutilizar.
  # Esto evita la duplicación y facilita el mantenimiento.
  APP_NAME: '${APP_NAME}'
  APP_ENV: '${APP_ENV}'
  APP_KEY: '${APP_KEY}'
  APP_DEBUG: '${APP_DEBUG}'
  APP_URL: '${APP_URL}'
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: '${DB_DATABASE}'
  DB_USERNAME: '${DB_USERNAME}'
  DB_PASSWORD: '${DB_PASSWORD}'
  REDIS_HOST: redis
  REDIS_PORT: 6379

services:
  # ---------------------------------------------------
  # Servidor Web Nginx (Punto de Entrada)
  # ---------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gobebio-nginx
    ports:
      - "8080:80" # Expone la aplicación en el puerto 8080 del host
    depends_on: # Nginx depende de que el backend esté listo para recibir tráfico.
      backend:
        condition: service_started
    networks:
      - gobebio-net

  # ---------------------------------------------------
  # Backend Laravel (Aplicación Principal)
  # ---------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gobebio-app # Le damos un nombre a la imagen construida
    container_name: gobebio-backend
    depends_on:
      mysql: # Espera a que la base de datos esté saludable antes de iniciar.
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    # Añade este volumen para que los cambios en el código local se reflejen en el contenedor.
    volumes:
      - ./backend:/var/www/html
    environment: *common-env-variables # Reutiliza las variables comunes.
    # El entrypoint original de la imagen se encargará de la configuración.
    # Solo especificamos el comando final que debe ejecutar.
    command: unitd --no-daemon --control unix:/var/run/control.unit.sock

  # ---------------------------------------------------
  # Worker de Laravel (Procesa Colas)
  # ---------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Reutilizamos la imagen construida para el backend en lugar de reconstruirla.
    # No necesita una sección 'build'.
    image: gobebio-app
    container_name: gobebio-worker
    volumes:
      - ./backend:/var/www/html
    depends_on: # El worker depende de que la BD y Redis estén listos.
      backend: # Añade esta dependencia para asegurar que la imagen se construya primero.
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gobebio-net
    environment: *common-env-variables # Reutiliza las variables comunes.
    command: php artisan queue:work --sleep=3 --tries=3

  # ---------------------------------------------------
  # Microservicio Biométrico (FastAPI)
  # ---------------------------------------------------
  zkservice:
    build:
      context: ./zkService
      dockerfile: Dockerfile
    ports:
      - "8001:8001" # Expone el puerto del microservicio
    container_name: gobebio-zkservice
    networks:
      - gobebio-net
    volumes:
      - ./zkService:/app # Ideal para desarrollo, en producción el código va en la imagen
    # Se quita --reload para producción
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      mysql:
        condition: service_healthy

  # ---------------------------------------------------
  # Base de Datos MySQL
  # ---------------------------------------------------
  mysql:
    image: 'mysql/mysql-server:8.0'
    container_name: gobebio-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - gobebio-mysql-data:/var/lib/mysql
    networks:
      - gobebio-net
    healthcheck:
      # Comprueba si el servidor MySQL está listo para aceptar comandos.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # Redis (Caché y Colas)
  # ---------------------------------------------------
  redis:
    image: 'redis:alpine'
    container_name: gobebio-redis
    ports:
      - "6379:6379"
    volumes:
      - gobebio-redis-data:/data
    networks:
      - gobebio-net
    healthcheck:
      # Comprueba si el servidor Redis está respondiendo.
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gobebio-net:
    driver: bridge

volumes:
  gobebio-mysql-data:
    driver: local
  gobebio-redis-data:
    driver: local