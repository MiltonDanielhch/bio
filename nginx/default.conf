server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://backend:80; # Reenvía las solicitudes al servicio 'backend' en el puerto 80
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloque para redirigir al microservicio biométrico para pruebas
    location /api/zk/ {
        # Redirige las peticiones al microservicio ZK que corre en la red del host.
        # Usamos host.docker.internal que configuramos en docker-compose.yml
        proxy_pass http://host.docker.internal:8001/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}