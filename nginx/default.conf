server {
    listen 80;
    server_name localhost;

    # 1. Definimos el directorio raíz público de Laravel
    root /var/www/html/public;

    # 2. Añadimos index.php para que sea reconocido como archivo de índice
    index index.php;

    # 3. Esta es la lógica principal
    location / {
        # Intenta encontrar un archivo con ese nombre ($uri).
        # Si no lo encuentra, pasa la petición al index.php de Laravel.
        try_files $uri /index.php?$query_string;
    }

    # 4. Todas las peticiones a archivos .php se envían al backend
    location ~ \.php$ {
        # Pasamos la petición al servicio 'backend' que ejecuta PHP Unit
        proxy_pass http://backend:8000;

        # Cabeceras CRÍTICAS para que el backend sepa que está detrás de un proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}