services:
  # ---------------------------------------------------
  # Backend Laravel (Development Overrides)
  # ---------------------------------------------------
  backend:
    volumes:
      # Mount local source code to see changes immediately
      - ./backend:/var/www/html
      # IMPORTANT: Keep the container's 'vendor' directory (Linux compatible)
      # instead of using the host's 'vendor' (Windows compatible), to avoid errors.
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  # ---------------------------------------------------
  # Worker & Scheduler (Sync with Backend Code)
  # ---------------------------------------------------
  worker:
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=local

  scheduler:
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=local

  # ---------------------------------------------------
  # ZkService (Python Hot Reload)
  # ---------------------------------------------------
  zkservice:
    volumes:
      - ./zkService:/app
    environment:
      - PYTHONUNBUFFERED=1
    # Override command to enable auto-reload (--reload)
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload" ]
